<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santa Claus — santasgotaux</title>
<meta name="description" content="Santa Claus · My Workshop — reviews, socials, and the man himself.">
<meta name="theme-color" content="#0d2b1f">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta property="og:title" content="Santa Claus — My Workshop">
<meta property="og:description" content="All my reviews, and where to find me.">
<meta property="og:image" content="santa.jpg">
<meta property="og:type" content="website">

<style>
  :root{
    --evergreen:#0d2b1f;
    --evergreen-deep:#061510;
    --cream:#fdf6e8;
    --cream-dim:#cbbfa8;
    --gold:#e3b95f;
    --red:#b3121f;
    --red-hi:#d21f2d;
    --card:rgba(253,246,232,.955);
    --ink:#15201b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 70% at 50% -10%, #1b4633 0%, transparent 60%),
      linear-gradient(180deg, var(--evergreen) 0%, var(--evergreen-deep) 100%);
    background-attachment:fixed;
    color:var(--cream);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
    padding:0 20px 64px;
  }

  /* ── snow ───────────────────────────────────────────────────────────── */
  .snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .snow i{
    position:absolute;top:-12px;display:block;border-radius:50%;
    background:#fff;opacity:.75;filter:blur(.3px);
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translate3d(0,-12px,0) rotate(0)}
    100%{transform:translate3d(var(--drift,14px),102vh,0) rotate(360deg)}
  }
  @media (prefers-reduced-motion:reduce){ .snow{display:none} }

  /* ── header ─────────────────────────────────────────────────────────── */
  main{position:relative;z-index:1;width:100%;max-width:520px;text-align:center}
  .avatar-ring{
    width:152px;height:152px;margin:56px auto 22px;border-radius:50%;
    padding:5px;
    background:conic-gradient(from 210deg,var(--gold),#fff5dc 25%,var(--red-hi) 50%,var(--gold) 72%,#fff5dc 100%);
    box-shadow:0 14px 40px rgba(0,0,0,.45);
  }
  .avatar-ring img{
    width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;
    border:4px solid var(--evergreen);
  }
  h1{
    font-family:"Hoefler Text",Georgia,"Times New Roman",serif;
    font-size:40px;line-height:1.1;letter-spacing:.01em;margin:0 0 8px;
    text-wrap:balance;
  }
  .subtitle{
    margin:0 0 34px;font-size:17px;color:var(--cream-dim);
    letter-spacing:.02em;
  }
  .handle{
    margin:0 0 34px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);
  }

  /* ── link groups ────────────────────────────────────────────────────── */
  .group{margin:0 0 26px}
  .group-label{
    display:flex;align-items:center;gap:12px;
    margin:0 2px 12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--cream-dim);opacity:.75;
  }
  .group-label::before,.group-label::after{
    content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(253,246,232,.28),transparent);
  }

  .link{
    display:flex;align-items:center;gap:14px;
    width:100%;padding:15px 18px;margin-bottom:12px;
    background:var(--card);color:var(--ink);
    border:1px solid rgba(0,0,0,.06);border-radius:16px;
    text-decoration:none;font-size:17px;font-weight:600;
    box-shadow:0 3px 0 rgba(0,0,0,.22),0 10px 24px rgba(0,0,0,.22);
    transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
  }
  .link:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(0,0,0,.22),0 16px 30px rgba(0,0,0,.3)}
  .link:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.22),0 6px 16px rgba(0,0,0,.25)}
  .link:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .link .label{flex:1;text-align:left}
  .link .chev{opacity:.3;flex-shrink:0}

  .icon{
    width:44px;height:44px;flex-shrink:0;border-radius:12px;
    display:grid;place-items:center;background:#f0e7d4;overflow:hidden;
  }
  .icon svg{width:22px;height:22px}
  .icon img{width:30px;height:30px;object-fit:contain}
  /* photo icons fill the tile edge to edge instead of sitting inside it */
  .icon.photo{background:none}
  .icon.photo img{width:100%;height:100%;object-fit:cover;border-radius:12px}

  /* primary — his own front door */
  .link.primary{
    background:linear-gradient(180deg,var(--red-hi),var(--red));
    color:#fff8ea;border-color:rgba(0,0,0,.25);
  }
  .link.primary .icon{background:rgba(255,255,255,.16)}
  .link.primary .icon svg{stroke:#fff8ea}
  .link.primary .chev{opacity:.55}

  footer{
    position:relative;z-index:1;margin-top:26px;
    font-size:12.5px;color:var(--cream-dim);opacity:.6;letter-spacing:.03em;
  }

  @media (max-width:420px){
    h1{font-size:33px}
    .avatar-ring{width:128px;height:128px;margin-top:40px}
    .link{font-size:16px;padding:14px 15px}
  }
</style>
</head>
<body>

<div class="snow" aria-hidden="true"></div>

<main>
  <div class="avatar-ring">
    <img src="santa.jpg" alt="Santa Claus">
  </div>

  <h1>Santa Claus</h1>
  <p class="subtitle">My Workshop</p>

  <!-- ── The man himself ─────────────────────────────────────────────── -->
  <section class="group">
    <p class="group-label">The man himself</p>

    <a class="link primary" href="https://www.jollysantablueeyes.com/" target="_blank" rel="noopener">
      <span class="icon photo" aria-hidden="true"><img src="jollysanta.png" alt=""></span>
      <span class="label">Jolly Santa Blue Eyes</span>
      <span class="chev" aria-hidden="true">›</span>
    </a>

    <!-- TODO: main Instagram — no URL was given for this one. Drop the handle in
         below and delete these comment markers to switch it on.
    <a class="link" href="https://www.instagram.com/PUT_HANDLE_HERE/" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c1121f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1.1" fill="#c1121f" stroke="none"/>
        </svg>
      </span>
      <span class="label">Instagram</span>
      <span class="chev" aria-hidden="true">›</span>
    </a>
    -->

  </section>

  <!-- ── Reviews ─────────────────────────────────────────────────────── -->
  <section class="group">
    <p class="group-label">The list</p>

    <a class="link" href="https://podiu.ms/santaclaus" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true"><img src="podiums.png" alt=""></span>
      <span class="label">Reviews</span>
      <span class="chev" aria-hidden="true">›</span>
    </a>
  </section>

  <!-- ── santasgotaux ────────────────────────────────────────────────── -->
  <section class="group">
    <p class="group-label">Santa's Got Aux</p>

    <a class="link" href="https://www.instagram.com/santasgotaux/" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#b3121f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/>
          <circle cx="17.4" cy="6.6" r="1.1" fill="#b3121f" stroke="none"/>
        </svg>
      </span>
      <span class="label">Instagram</span>
      <span class="chev" aria-hidden="true">›</span>
    </a>

    <a class="link" href="https://www.tiktok.com/@santasgotaux" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#0d2b1f" stroke="none">
          <path d="M16.5 3c.4 2.1 1.7 3.6 3.8 3.9v2.7c-1.4.1-2.7-.3-3.9-1v5.9c0 3.6-2.6 6.1-6 6.1-3.2 0-5.7-2.4-5.7-5.6 0-3.4 2.8-5.9 6.4-5.5v2.9c-.4-.1-.8-.2-1.2-.2-1.5 0-2.7 1.2-2.7 2.7 0 1.6 1.2 2.8 2.8 2.8 1.6 0 2.7-1.2 2.7-2.9V3z"/>
        </svg>
      </span>
      <span class="label">TikTok</span>
      <span class="chev" aria-hidden="true">›</span>
    </a>
  </section>

  <footer>🎄 santasgotaux.com</footer>
</main>

<script>
  // Snow: a modest number of flakes, varied size/speed/drift so it doesn't read
  // as a repeating pattern. Skipped entirely when reduced motion is requested.
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const snow = document.querySelector(".snow");
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 42; i++) {
      const f = document.createElement("i");
      const size = 2 + Math.random() * 4;
      f.style.width = f.style.height = size.toFixed(1) + "px";
      f.style.left = (Math.random() * 100).toFixed(2) + "vw";
      f.style.opacity = (0.25 + Math.random() * 0.55).toFixed(2);
      f.style.setProperty("--drift", (Math.random() * 90 - 45).toFixed(0) + "px");
      f.style.animationDuration = (7 + Math.random() * 11).toFixed(1) + "s";
      f.style.animationDelay = (-Math.random() * 18).toFixed(1) + "s";
      frag.appendChild(f);
    }
    snow.appendChild(frag);
  })();
</script>
</body>
</html>
